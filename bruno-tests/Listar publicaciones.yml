info:
  name: Listar publicaciones
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/posts?page=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
