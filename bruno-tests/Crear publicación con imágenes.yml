info:
  name: Crear publicación con imágenes
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/posts"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: Mi primera publicación
        contentType: Auto
      - name: content
        type: text
        value: Hola a todos, comparto fotos de mi viaje
        contentType: Auto
      - name: images[]
        type: file
        value: []
        contentType: image/jpeg
      - name: images[]
        type: file
        value: []
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
