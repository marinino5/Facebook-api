info:
  name: Agregar comentario
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/posts/1/comments"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      
      {
        "author": "Carlos Gómez",
        "content": "¡Qué buenas fotos!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
